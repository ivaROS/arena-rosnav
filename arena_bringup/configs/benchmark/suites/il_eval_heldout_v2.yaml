# Held-out evaluation v2 for gap scorers trained on il_dataset_small_v1 (same map, gru_learn).
# All scenarios have pedestrians; four also have static obstacles (long shelves). v1's seven
# pedestrian-only scenarios are kept unchanged, and four smartgap scenarios with shelves are
# added. None of the eleven is in the training suite (it uses smartgap 6 and 8). One episode
# each; run with il_tools/il_eval_model, which measures time to goal and collisions and
# records RViz.
#
#   stage                    scenario                        peds  shelves  start          goal
#   v3  bottom left          0_50ped_middle_start_v3.json    50    0        (14.2, 13.4)   (2.0, 5.9)
#   v5  bottom right         0_50ped_middle_start_v5.json    50    0        (13.1, 11.2)   (26.1, 4.2)
#   v7  bottom right         0_50ped_middle_start_v7.json    50    0        (13.4, 11.8)   (27.1, 3.4)
#   v9  bottom right         0_50ped_middle_start_v9.json    50    0        (9.0, 13.1)    (24.4, 6.8)
#   v10 bottom right         0_50ped_middle_start_v10.json   50    0        (15.6, 11.0)   (25.3, 4.0)
#   v11 bottom left          0_50ped_middle_start_v11.json   50    0        (14.7, 13.4)   (7.7, 7.7)
#   smartgap 11              smartgap_scenario11.json        50    0        (14.2, 13.4)   (2.0, 5.9)
#   smartgap 4               smartgap_scenario4.json         35    3        (12, 22)       (28, 3)
#   smartgap 5               smartgap_scenario5.json         35    3        (12, 22)       (28, 3)
#   smartgap 7               smartgap_scenario7.json         35    6        (3, 2)         (27, 23)
#   smartgap 10              smartgap_scenario10.json        35    11       (4, 5)         (28, 23)
stages:
  - name: il_eval_v3_50ped_bottom_left
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
      SCENARIO:
        file: 0_50ped_middle_start_v3.json

  - name: il_eval_v5_50ped_bottom_right
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
